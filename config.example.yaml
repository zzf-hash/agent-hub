# Agent Hub 配置
port: 8100

# 鉴权 (留空则不鉴权，生产环境建议设置)
auth_token: "<REDACTED-真实token只在服务器>"

# 数据库路径
db_path: "./db.sqlite"

# 消息保留天数 (超过自动清理，0=不清理)
message_retention_days: 30

# 日志级别: debug / info / warn / error
log_level: info

# Hermes webhook (审核结果转发到老板微信)
# 注意：secret 是订阅级别的（每个 webhook subscribe 生成），不是 gateway 级别的
hermes_webhook_url: "http://localhost:8644/webhooks/agenthub-task"
hermes_webhook_secret: "<REDACTED-真实secret只在服务器>"
